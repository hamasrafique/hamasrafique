<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hamas Rafique GitHub Profile Banner</title>
  <desc id="desc">Animated dark blue banner for Hamas Rafique, Software Quality Assurance Engineer, WordPress Developer, and Computer Science Student.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070B1D"/>
      <stop offset="0.52" stop-color="#0B1230"/>
      <stop offset="1" stop-color="#111B3F"/>
    </linearGradient>
    <linearGradient id="blue" x1="182" y1="120" x2="1270" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CB2FF"/>
      <stop offset="0.48" stop-color="#7494EC"/>
      <stop offset="1" stop-color="#4468D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1270 120) rotate(123) scale(520 520)">
      <stop offset="0" stop-color="#7494EC" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7494EC" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      @keyframes floatCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
      @keyframes pulseLine { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes draw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .15; } }
      .card { animation: floatCard 6s ease-in-out infinite; transform-origin: center; }
      .line { animation: pulseLine 3s ease-in-out infinite; }
      .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 4.5s ease forwards; }
      .cursor { animation: blink 1.2s steps(2) infinite; }
    </style>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="36" fill="url(#glow)"/>
  <path d="M0 440C228 350 413 363 610 414C860 479 1036 555 1600 363V560H0V440Z" fill="#7494EC" opacity="0.11"/>
  <path d="M0 488C290 370 485 428 742 468C1007 509 1235 503 1600 348V560H0V488Z" fill="#7494EC" opacity="0.16"/>

  <g opacity="0.28">
    <path class="draw" d="M119 92H402C445 92 480 127 480 170V246" stroke="#7494EC" stroke-width="3" stroke-linecap="round"/>
    <path class="draw" d="M1452 448H1168C1125 448 1090 413 1090 370V312" stroke="#7494EC" stroke-width="3" stroke-linecap="round"/>
    <circle cx="119" cy="92" r="7" fill="#7494EC"/>
    <circle cx="1452" cy="448" r="7" fill="#7494EC"/>
  </g>

  <g filter="url(#softShadow)" class="card">
    <rect x="986" y="92" width="424" height="326" rx="30" fill="#0F1736" stroke="#26376F"/>
    <rect x="1026" y="132" width="142" height="18" rx="9" fill="#7494EC"/>
    <rect class="line" x="1026" y="178" width="302" height="13" rx="6.5" fill="#33457F"/>
    <rect class="line" x="1026" y="211" width="238" height="13" rx="6.5" fill="#33457F" style="animation-delay:.4s"/>
    <rect x="1026" y="274" width="98" height="46" rx="14" fill="#121F49" stroke="#26376F"/>
    <rect x="1148" y="274" width="98" height="46" rx="14" fill="#121F49" stroke="#26376F"/>
    <rect x="1270" y="274" width="98" height="46" rx="14" fill="#121F49" stroke="#26376F"/>
    <circle cx="1075" cy="297" r="10" fill="#7494EC"/>
    <path d="M1177 304L1197 286L1217 304" stroke="#7494EC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1296 297H1342" stroke="#7494EC" stroke-width="7" stroke-linecap="round"/>
    <rect x="1026" y="356" width="252" height="16" rx="8" fill="#7494EC" opacity="0.72"/>
  </g>

  <g>
    <rect x="130" y="118" width="74" height="74" rx="20" fill="url(#blue)"/>
    <path d="M155 156L167 168L192 142" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="268" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="800">Hamas Rafique</text>
    <text x="130" y="326" fill="#BFD0FF" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700">Software Quality Assurance Engineer</text>
    <text x="130" y="374" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="28">WordPress Developer | Computer Science Student</text>
    <text x="130" y="430" fill="#7494EC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Manual Testing | API Testing | Selenium Automation | WordPress</text>
    <rect class="cursor" x="896" y="405" width="5" height="34" rx="2.5" fill="#7494EC"/>
  </g>

  <g transform="translate(1268 56)">
    <rect width="188" height="48" rx="24" fill="#0F1736" stroke="#26376F"/>
    <circle cx="30" cy="24" r="8" fill="#7494EC"/>
    <text x="52" y="31" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Karachi, PK</text>
  </g>
</svg>
